<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #3730a3;
            --secondary-color: #f8fafc;
            --text-color: #1e293b;
            --text-light: #64748b;
            --bg-color: #ffffff;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --jarvis-message-bg: #f1f5f9;
            --user-message-bg: #4f46e5;
            --box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --box-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .dark-theme {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #1e293b;
            --text-color: #f1f5f9;
            --text-light: #94a3b8;
            --bg-color: #0f172a;
            --border-color: #334155;
            --jarvis-message-bg: #1e293b;
            --user-message-bg: #6366f1;
            --box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            --box-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--box-shadow-lg);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo i {
            font-size: 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: var(--secondary-color);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .message {
            max-width: 70%;
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            position: relative;
            animation: slideIn 0.3s ease;
            box-shadow: var(--box-shadow);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-message-bg);
            color: white;
            border-bottom-right-radius: 0.5rem;
        }

        .message.jarvis {
            align-self: flex-start;
            background: var(--jarvis-message-bg);
            color: var(--text-color);
            border-bottom-left-radius: 0.5rem;
        }

        .message-content {
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            text-align: right;
        }

        .message.jarvis .message-time {
            text-align: left;
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--jarvis-message-bg);
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            border-bottom-left-radius: 0.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .typing-indicator.show {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 0.25rem;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-light);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem 2rem;
            background: var(--secondary-color);
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            padding: 0.75rem 1.5rem;
            box-shadow: var(--box-shadow);
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            min-height: 24px;
        }

        .message-input::placeholder {
            color: var(--text-light);
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover:not(:disabled) {
            color: var(--primary-color);
            background: rgba(79, 70, 229, 0.1);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.send {
            background: var(--primary-color);
            color: white;
        }

        .action-btn.send:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .action-btn.recording {
            color: var(--error-color);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 2rem;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .welcome-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .welcome-subtitle {
            font-size: 1.125rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            max-width: 800px;
            width: 100%;
        }

        .suggestion {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .suggestion:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-lg);
        }

        .suggestion-icon {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .suggestion-text {
            font-weight: 500;
            color: var(--text-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .logo h1 {
                font-size: 1.25rem;
            }

            .chat-container {
                padding: 1rem;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 1rem;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>Jarvis AI Assistant</h1>
            </div>
            <div class="header-controls">
                <div class="status-indicator">
                    <div id="status-dot" class="status-dot"></div>
                    <span id="status-text">Offline</span>
                </div>
                <button id="theme-toggle" class="header-btn" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="power-btn" class="header-btn" title="Start/Stop Jarvis">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="welcome-screen">
                <div class="welcome-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <h2 class="welcome-title">Welcome to Jarvis AI</h2>
                <p class="welcome-subtitle">Your intelligent assistant is ready to help</p>
                
                <div class="suggestions">
                    <div class="suggestion" data-message="What time is it?">
                        <div class="suggestion-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="suggestion-text">What time is it?</div>
                    </div>
                    <div class="suggestion" data-message="What's the weather today?">
                        <div class="suggestion-icon">
                            <i class="fas fa-cloud-sun"></i>
                        </div>
                        <div class="suggestion-text">What's the weather today?</div>
                    </div>
                    <div class="suggestion" data-message="Search for latest AI news">
                        <div class="suggestion-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <div class="suggestion-text">Search for latest AI news</div>
                    </div>
                    <div class="suggestion" data-message="Open notepad">
                        <div class="suggestion-icon">
                            <i class="fas fa-file-text"></i>
                        </div>
                        <div class="suggestion-text">Open notepad</div>
                    </div>
                </div>
            </div>

            <!-- Chat Container -->
            <div id="chat-container" class="chat-container" style="display: none;">
                <!-- Messages will be added here dynamically -->
                
                <!-- Typing Indicator -->
                <div id="typing-indicator" class="typing-indicator">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span>Jarvis is thinking...</span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <textarea 
                    id="message-input" 
                    class="message-input" 
                    placeholder="Type a message or click the microphone to speak..."
                    rows="1"
                ></textarea>
                <div class="input-actions">
                    <button id="voice-btn" class="action-btn" title="Voice Input">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button id="send-btn" class="action-btn send" title="Send Message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = window.location.origin + '/api';
        const WS_URL = `ws://${window.location.host}/api/ws`;

        // DOM Elements
        const elements = {
            welcomeScreen: document.getElementById('welcome-screen'),
            chatContainer: document.getElementById('chat-container'),
            messageInput: document.getElementById('message-input'),
            sendBtn: document.getElementById('send-btn'),
            voiceBtn: document.getElementById('voice-btn'),
            powerBtn: document.getElementById('power-btn'),
            themeToggle: document.getElementById('theme-toggle'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            typingIndicator: document.getElementById('typing-indicator')
        };

        // State
        let state = {
            isConnected: false,
            isRecording: false,
            isDarkTheme: localStorage.getItem('darkTheme') === 'true',
            sessionId: generateSessionId(),
            websocket: null,
            recognition: null
        };

        // Initialize the application
        function init() {
            setupTheme();
            setupEventListeners();
            connectWebSocket();
            checkJarvisStatus();
            autoResizeTextarea();
        }

        // Setup theme
        function setupTheme() {
            if (state.isDarkTheme) {
                document.body.classList.add('dark-theme');
                elements.themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Send button
            elements.sendBtn.addEventListener('click', sendMessage);

            // Message input
            elements.messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Voice button
            elements.voiceBtn.addEventListener('click', toggleVoiceRecording);

            // Power button
            elements.powerBtn.addEventListener('click', toggleJarvisPower);

            // Theme toggle
            elements.themeToggle.addEventListener('click', toggleTheme);

            // Suggestion clicks
            document.querySelectorAll('.suggestion').forEach(suggestion => {
                suggestion.addEventListener('click', () => {
                    const message = suggestion.dataset.message;
                    elements.messageInput.value = message;
                    sendMessage();
                });
            });
        }

        // Auto-resize textarea
        function autoResizeTextarea() {
            elements.messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }

        // WebSocket connection
        function connectWebSocket() {
            try {
                state.websocket = new WebSocket(WS_URL);

                state.websocket.onopen = () => {
                    console.log('WebSocket connected');
                };

                state.websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };

                state.websocket.onclose = () => {
                    console.log('WebSocket disconnected');
                    setTimeout(connectWebSocket, 3000); // Reconnect after 3 seconds
                };

                state.websocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
            }
        }

        // Handle WebSocket messages
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'connection':
                    updateStatus(data.data.status.is_running);
                    break;
                case 'chat_response':
                    addMessage(data.data.message, true);
                    hideTypingIndicator();
                    break;
                case 'status_update':
                    updateStatus(data.data.is_running);
                    break;
            }
        }

        // Check Jarvis status
        async function checkJarvisStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/status`);
                const data = await response.json();
                updateStatus(data.is_running);
            } catch (error) {
                console.error('Failed to check status:', error);
                updateStatus(false);
            }
        }

        // Update status indicator
        function updateStatus(isRunning) {
            state.isConnected = isRunning;
            
            if (isRunning) {
                elements.statusDot.classList.add('online');
                elements.statusText.textContent = 'Online';
                elements.powerBtn.innerHTML = '<i class="fas fa-stop"></i>';
                elements.sendBtn.disabled = false;
                elements.voiceBtn.disabled = false;
                elements.messageInput.disabled = false;
            } else {
                elements.statusDot.classList.remove('online');
                elements.statusText.textContent = 'Offline';
                elements.powerBtn.innerHTML = '<i class="fas fa-play"></i>';
                elements.sendBtn.disabled = true;
                elements.voiceBtn.disabled = true;
                elements.messageInput.disabled = true;
            }
        }

        // Toggle Jarvis power
        async function toggleJarvisPower() {
            const endpoint = state.isConnected ? '/stop' : '/start';
            
            try {
                elements.powerBtn.innerHTML = '<div class="loading"></div>';
                
                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.status === 'running') {
                    updateStatus(true);
                    addMessage('Jarvis is now online and ready to assist you!', true);
                } else if (data.status === 'stopped') {
                    updateStatus(false);
                    addMessage('Jarvis has been stopped.', true);
                }
                
            } catch (error) {
                console.error('Failed to toggle Jarvis power:', error);
                addMessage('Failed to communicate with Jarvis. Please try again.', true);
            }
        }

        // Send message
        async function sendMessage() {
            const message = elements.messageInput.value.trim();
            
            if (!message || !state.isConnected) return;

            // Clear input and show chat
            elements.messageInput.value = '';
            elements.messageInput.style.height = 'auto';
            showChat();

            // Add user message
            addMessage(message, false);
            showTypingIndicator();

            try {
                // Send via WebSocket if available, otherwise use REST API
                if (state.websocket && state.websocket.readyState === WebSocket.OPEN) {
                    state.websocket.send(JSON.stringify({
                        type: 'chat',
                        message: message,
                        session_id: state.sessionId
                    }));
                } else {
                    // Fallback to REST API
                    const response = await fetch(`${API_BASE_URL}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            session_id: state.sessionId
                        })
                    });

                    const data = await response.json();
                    hideTypingIndicator();
                    
                    if (data.success) {
                        addMessage(data.message, true);
                    } else {
                        addMessage('Sorry, I encountered an error: ' + (data.error || 'Unknown error'), true);
                    }
                }

            } catch (error) {
                hideTypingIndicator();
                console.error('Error sending message:', error);
                addMessage('Sorry, I encountered a network error. Please check your connection.', true);
            }
        }

        // Add message to chat
        function addMessage(text, isJarvis) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', isJarvis ? 'jarvis' : 'user');

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.textContent = text;

            const timeDiv = document.createElement('div');
            timeDiv.classList.add('message-time');
            timeDiv.textContent = formatTime(new Date());

            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);

            // Insert before typing indicator
            elements.chatContainer.insertBefore(messageDiv, elements.typingIndicator);
            
            // Scroll to bottom
            elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
        }

        // Show/hide chat
        function showChat() {
            elements.welcomeScreen.classList.add('hidden');
            elements.chatContainer.style.display = 'flex';
        }

        // Show/hide typing indicator
        function showTypingIndicator() {
            elements.typingIndicator.classList.add('show');
            elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            elements.typingIndicator.classList.remove('show');
        }

        // Voice recording
        function toggleVoiceRecording() {
            if (!state.isConnected) return;

            if (!state.isRecording) {
                startVoiceRecording();
            } else {
                stopVoiceRecording();
            }
        }

        function startVoiceRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                addMessage('Sorry, speech recognition is not supported in your browser.', true);
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            state.recognition = new SpeechRecognition();
            
            state.recognition.continuous = false;
            state.recognition.interimResults = false;
            state.recognition.lang = 'en-US';

            state.recognition.onstart = () => {
                state.isRecording = true;
                elements.voiceBtn.classList.add('recording');
                elements.messageInput.placeholder = 'Listening...';
            };

            state.recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                elements.messageInput.value = transcript;
                setTimeout(() => sendMessage(), 500);
            };

            state.recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopVoiceRecording();
                addMessage('Sorry, I had trouble hearing you.', true);
            };

            state.recognition.onend = () => {
                stopVoiceRecording();
            };

            try {
                state.recognition.start();
            } catch (error) {
                console.error('Error starting speech recognition:', error);
                stopVoiceRecording();
                addMessage('Sorry, I had trouble starting voice recognition.', true);
            }
        }

        function stopVoiceRecording() {
            state.isRecording = false;
            elements.voiceBtn.classList.remove('recording');
            elements.messageInput.placeholder = 'Type a message or click the microphone to speak...';
            
            if (state.recognition) {
                state.recognition.stop();
                state.recognition = null;
            }
        }

        // Toggle theme
        function toggleTheme() {
            state.isDarkTheme = !state.isDarkTheme;
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('darkTheme', state.isDarkTheme);

            if (state.isDarkTheme) {
                elements.themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                elements.themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        // Utility functions
        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
